name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Isi di: Settings > Secrets and variables > Actions > Variables
      # Contoh: https://runnow2.NAMA-AKUN.workers.dev  (tanpa garis miring di akhir)
      WORKER_URL: ${{ vars.WORKER_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cek WORKER_URL
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Variabel repo WORKER_URL belum diisi (URL Cloudflare Worker Anda)."
            exit 1
          fi

      - name: Siapkan folder www (hanya file aplikasi)
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png badge-96.png www/
          # Di APK tidak ada server sendiri, jadi panggilan /api/... diarahkan ke Worker Anda
          sed -i "s#\"/api/#\"${WORKER_URL}/api/#g; s#\`/api/#\`${WORKER_URL}/api/#g" www/index.html
          grep -c "${WORKER_URL}/api/" www/index.html || echo "Catatan: index.html tidak memakai /api/ (langsung ke Intervals.icu)"

      - name: Pasang Capacitor + platform Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<JSON
          {
            "appId": "com.runnow.app",
            "appName": "Run Now",
            "webDir": "www",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RunNow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
