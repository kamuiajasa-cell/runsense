name: RunSense regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test adaptive coach with synthetic data
        run: node tests/adaptive-coach.synthetic.test.js
      - name: Test Friel training engine regression rules
        run: node tests/friel-engine.regression.test.js
      - name: Test four-week mileage and quality dose
        run: node tests/four-week-mileage.test.js
      - name: Test workout pipeline with synthetic data
        run: node tests/workout-pipeline.synthetic.test.js
      - name: Test session analysis with synthetic data
        run: node tests/session-analysis.synthetic.test.js
      - name: Test LTHR zone consistency with synthetic data
        run: node tests/lthr-zones.synthetic.test.js
      - name: Test native-like PWA interactions
        run: node tests/pwa-native-interactions.test.js
